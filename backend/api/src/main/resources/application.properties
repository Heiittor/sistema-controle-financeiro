# 1. Configurações de Conexão com o Banco de Dados (JDBC)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:controle_financeiro}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.fail-on-missing-locations=true
spring.jpa.open-in-view=false
# Segredo do JWT: vem de variável de ambiente. Sem valor padrão de propósito.
app.jwt.secret=${JWT_SECRET}
# Validade do token, em minutos.
app.jwt.expiracao-minutos=60
# Actuator: só o health é exposto, sem detalhes. O resto fica fechado.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Origens permitidas no CORS, separadas por vírgula.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
# Documentação da API (OpenAPI/Swagger). Em produção, desligue com SWAGGER_ATIVO=false.
springdoc.api-docs.enabled=${SWAGGER_ATIVO:true}
springdoc.swagger-ui.enabled=${SWAGGER_ATIVO:true}
# Perfil padrão: dev. Em produção, defina SPRING_PROFILES_ATIVO=prod.
spring.profiles.default=dev