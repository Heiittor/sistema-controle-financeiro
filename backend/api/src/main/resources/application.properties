# 1. Configurações de Conexão com o Banco de Dados (JDBC)
spring.datasource.url=jdbc:postgresql://localhost:5433/controle_financeiro
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.fail-on-missing-locations=true
logging.level.org.flywaydb=DEBUG
spring.jpa.open-in-view=false
# Segredo do JWT: vem de variável de ambiente. Sem valor padrão de propósito.
app.jwt.secret=${JWT_SECRET}
# Validade do token, em minutos.
app.jwt.expiracao-minutos=60