<a class="pular" href="#conteudo" (click)="$event.preventDefault(); principal.focus()">
  Pular para o conteúdo
</a>

<mat-sidenav-container
  class="shell"
  [class.painel]="
    titulo() === 'Dashboard' ||
    titulo() === 'Contas' ||
    titulo() === 'Movimentações' ||
    titulo() === 'Categorias' ||
    titulo() === 'Transferências' ||
    titulo() === 'Orçamentos'
  "
  [class.tela-contas]="
    titulo() === 'Contas' ||
    titulo() === 'Movimentações' ||
    titulo() === 'Categorias' ||
    titulo() === 'Transferências' ||
    titulo() === 'Orçamentos'
  "
  [class.tela-movimentacoes]="titulo() === 'Movimentações'"
  [class.tela-categorias]="titulo() === 'Categorias'"
  [class.tela-transferencias]="titulo() === 'Transferências'"
  [class.tela-orcamentos]="titulo() === 'Orçamentos'"
  autosize
>
  <mat-sidenav
    #menu
    id="menu-principal"
    class="sidebar"
    role="complementary"
    aria-label="Menu de navegação"
    [class.recolhida]="recolhida() && !compacto()"
    [mode]="compacto() ? 'over' : 'side'"
    [opened]="!compacto()"
  >
    <div
      class="menu"
      appMenuLateral
      [titulo]="titulo()"
      [compacto]="compacto()"
      [recolhida]="recolhida()"
      (fechar)="menu.close()"
      (alternar)="recolhida.set(!recolhida())"
      (sair)="sair()"
    ></div>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="topo">
      @if (compacto()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Abrir menu"
          aria-controls="menu-principal"
          [attr.aria-expanded]="menu.opened"
          (click)="menu.open()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <h1>{{ titulo() }}</h1>
      <button mat-button type="button" class="sair" (click)="sair()">
        <mat-icon>logout</mat-icon>Sair
      </button>
    </header>

    <main id="conteudo" class="conteudo" tabindex="-1" #principal>
      <router-outlet />
    </main>
    <footer class="rodape">Sistema de Controle Financeiro</footer>
  </mat-sidenav-content>
</mat-sidenav-container>
