name: CI

on:
  push:
    branches: [back, main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Compilar e rodar os testes
        working-directory: backend/api
        run: |
          chmod +x mvnw
          ./mvnw -B test