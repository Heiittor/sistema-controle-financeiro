version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: controle_financeiro_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: controle_financeiro
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: